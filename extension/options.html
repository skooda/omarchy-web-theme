<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Omarchy Web Theme</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 14px/1.5 system-ui, sans-serif;
      margin: 0;
      padding: 16px 20px;
      min-width: 280px;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p.hint { margin: 0 0 14px; opacity: 0.65; font-size: 12.5px; }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 4px;
      cursor: pointer;
      border-radius: 6px;
    }
    label:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: #7aa2f7; }
    .site { flex: 1; }
    .host { opacity: 0.55; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Omarchy Web Theme</h1>
  <p class="hint">Recolors every page with the palette of your current omarchy
  theme. Changes apply immediately; pages reset fully on their next reload.</p>
  <div id="sites"></div>
  <script src="options.js"></script>
</body>
</html>
